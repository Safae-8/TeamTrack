 <!-- Stadium header / top bar -->
<header class="topbar">

    <div class="topbar-spacer"></div>

    <div class="topbar-actions">

        <button type="button" class="month-selector" id="monthSelectorButton">
            <span>▣</span>
            <span id="selectedMonth"></span>
            <span>⌄</span>
        </button>
        <div class="month-picker" id="monthPicker">
            <div class="month-picker-header">
                <button type="button" id="previousMonth">‹</button>

                <strong id="monthPickerTitle"></strong>

                <button type="button" id="nextMonth">›</button>
            </div>

            <div class="month-picker-grid" id="monthPickerGrid"></div>
        </div>

        <div class="top-profile">

            <div class="top-avatar">
                S
            </div>

            <div>
                <strong>Team Manager</strong>
                <span>Administrator</span>
            </div>

            <span class="dropdown-arrow">⌄</span>

        </div>

    </div>

</header>
